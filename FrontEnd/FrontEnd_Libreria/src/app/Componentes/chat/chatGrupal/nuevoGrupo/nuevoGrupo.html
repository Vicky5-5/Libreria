<div class="chat-container">
<mat-card>
  <form [formGroup]="formNuevoGrupo" (ngSubmit)="crearGrupoNuevo()">
    <mat-form-field>
      <mat-label>Nombre del grupo</mat-label>
      <input matInput formControlName="nombreGrupo">
    </mat-form-field>

    <mat-form-field>
      <mat-label>Descripción</mat-label>
      <input matInput formControlName="descripcionGrupo">
    </mat-form-field>

    <button mat-raised-button type="submit">Crear grupo</button>
  </form>
  @if (errorMsg) {
    <p class="error">{{ errorMsg }}</p>
  }
</mat-card>
</div>
