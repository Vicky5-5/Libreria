<div class="contacto-container">

  <mat-card class="contacto-card">

    <mat-card-header>
      <mat-card-title>Contacto</mat-card-title>
      <mat-card-subtitle>
        ¿Tienes alguna pregunta? ¡Contáctanos!
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>

      <div class="contacto-info">

        <p>
          <mat-icon>email</mat-icon>
          <strong>Email:</strong>
          <a href="mailto:info@libreriaalejandria.com">
            info&#64;libreriaalejandria.com
          </a>
        </p>

        <p>
          <mat-icon>phone</mat-icon>
          <strong>Teléfono:</strong>
          +34 123 456 789
        </p>

        <p>
          <mat-icon>location_on</mat-icon>
          <strong>Dirección:</strong>
          Calle Miguel de Cervantes, 123, Ciudad del Quijote, España
        </p>

      </div>

      <form class="contacto-form">

        <mat-form-field appearance="outline">
          <mat-label>Nombre</mat-label>
          <input matInput required>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" required>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Mensaje</mat-label>
          <textarea matInput rows="5" required></textarea>
        </mat-form-field>

        <button id="boton" mat-raised-button type="submit">
          Enviar
        </button>

      </form>

    </mat-card-content>

  </mat-card>

</div>
